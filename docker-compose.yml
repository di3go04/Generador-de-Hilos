version: "3.9"

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: urban
      POSTGRES_PASSWORD: urban
      POSTGRES_DB: urban
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urban"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── MinIO (Local S3) ────────────────────────────────────────────────────────
  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Create Buckets ──────────────────────────────────────────────────────────
  createbuckets:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc config host add myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/urban-videos || true;
      /usr/bin/mc anonymous set public myminio/urban-videos;
      exit 0;
      "

  # ── Fastify API ────────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgres://urban:urban@db:5432/urban
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET: urban-videos
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ── FFmpeg Worker ──────────────────────────────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: worker/Dockerfile
    environment:
      DATABASE_URL: postgres://urban:urban@db:5432/urban
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET: urban-videos
      WORKER_POLL_MS: "3000"
      WORKER_CONCURRENCY: "2"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ── Next.js Frontend ────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./urban
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NODE_ENV: production
    depends_on:
      - api

volumes:
  pgdata:
  minio_data:
