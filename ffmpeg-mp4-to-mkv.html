<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MP4 → MKV · ffmpeg.wasm desde CDN</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0b0d17;
      color: #e2e8f0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #12142a;
      border: 1px solid rgba(0, 242, 255, 0.1);
      border-radius: 1.25rem;
      padding: 2.5rem;
      max-width: 520px;
      width: 100%;
      margin: 1rem;
    }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.25rem; }
    .sub { color: #64748b; font-size: 0.875rem; margin-bottom: 1.75rem; }
    .drop-zone {
      border: 2px dashed rgba(0, 242, 255, 0.2);
      border-radius: 1rem;
      padding: 2rem 1rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .drop-zone:hover { border-color: #00f2ff; background: rgba(0, 242, 255, 0.03); }
    .drop-zone.dragover { border-color: #00f2ff; background: rgba(0, 242, 255, 0.06); }
    .drop-zone input { display: none; }
    .drop-zone .icon { font-size: 2rem; margin-bottom: 0.5rem; }
    .drop-zone .label { font-size: 0.9rem; color: #94a3b8; }
    .drop-zone .hint { font-size: 0.75rem; color: #475569; margin-top: 0.4rem; }
    .file-info {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      background: rgba(255,255,255,0.03);
      border-radius: 0.75rem;
      margin-top: 1rem;
      font-size: 0.875rem;
    }
    .file-info .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-info .size { color: #64748b; font-variant-numeric: tabular-nums; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 0.75rem;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: linear-gradient(135deg, #00f2ff, #8b5cf6); color: #fff; }
    .btn-primary:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
    .btn-success { background: #10b981; color: #fff; }
    .btn-success:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
    .status {
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      border-radius: 0.75rem;
      font-size: 0.8rem;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.04);
      min-height: 2.75rem;
      line-height: 1.5;
      word-break: break-word;
    }
    .status.error { border-color: rgba(239,68,68,0.3); color: #fca5a5; }
    .status.success { border-color: rgba(16,185,129,0.3); color: #6ee7b7; }
    .status.info { border-color: rgba(0,242,255,0.2); color: #67e8f9; }
    .mt-3 { margin-top: 1rem; }
  </style>
</head>
<body>

<div class="card">
  <h1>MP4 → MKV</h1>
  <p class="sub">Conversión directa sin recodificar (códec copy)</p>

  <!-- drop zone -->
  <div class="drop-zone" id="dropZone">
    <input type="file" id="fileInput" accept=".mp4,video/mp4" />
    <div class="icon">🎬</div>
    <div class="label">Seleccioná o arrastrá un archivo MP4</div>
    <div class="hint">Se procesa al instante en tu navegador</div>
  </div>

  <!-- file info (hidden) -->
  <div class="file-info" id="fileInfo" style="display:none">
    <span class="name" id="fileName"></span>
    <span class="size" id="fileSize"></span>
  </div>

  <!-- convert button -->
  <button class="btn btn-primary mt-3" id="convertBtn" disabled>Convertir a MKV</button>

  <!-- status / log -->
  <div class="status" id="status">Cargando FFmpeg…</div>
</div>

<!-- ─── IMPORT MAP ─────────────────────────────────────────── -->
<script type="importmap">
{
  "imports": {
    "@ffmpeg/ffmpeg": "https://unpkg.com/@ffmpeg/ffmpeg@0.12.15/dist/esm/index.js",
    "@ffmpeg/util":   "https://unpkg.com/@ffmpeg/util@0.12.2/dist/esm/index.js"
  }
}
</script>

<script type="module">
// ─── Imports ────────────────────────────────────────────────
import { FFmpeg } from "@ffmpeg/ffmpeg";
import { fetchFile, toBlobURL } from "@ffmpeg/util";

// ─── Referencias DOM ───────────────────────────────────────
const $ = (s) => document.querySelector(s);
const dropZone   = $("#dropZone");
const fileInput  = $("#fileInput");
const fileInfo   = $("#fileInfo");
const fileName   = $("#fileName");
const fileSize   = $("#fileSize");
const convertBtn = $("#convertBtn");
const statusEl   = $("#status");

let selectedFile = null;
let ffmpeg       = null;
let loaded       = false;

// ─── Logging ────────────────────────────────────────────────
function log(msg, type = "info") {
  statusEl.className = `status ${type}`;
  statusEl.textContent = msg;
}

// ─── Cargar FFmpeg con Blob URLs ────────────────────────────
async function loadFFmpeg() {
  if (loaded) return;

  const base = "https://unpkg.com/@ffmpeg/core@0.12.6/dist/esm";
  ffmpeg = new FFmpeg();

  ffmpeg.on("log", ({ message }) => {
    // omitir logs muy verbosos
    if (message.startsWith("ffmpeg version") || message.includes("--enable")) return;
    log(message, "info");
  });

  try {
    log("Descargando core desde CDN y creando Blob URLs…", "info");

    // ─── toBlobURL convierte URLs de CDN a blob: URLs ────
    //      Al ser blob: URLs, el Worker se crea desde el
    //      mismo origen → no hay SecurityError.
    const coreURL   = await toBlobURL(`${base}/core.js`,   "text/javascript");
    const wasmURL   = await toBlobURL(`${base}/core.wasm`, "application/wasm");
    const workerURL = await toBlobURL(`${base}/worker.js`, "text/javascript");

    log("Inicializando FFmpeg…", "info");
    await ffmpeg.load({ coreURL, wasmURL, workerURL });
    loaded = true;
    log("✅ FFmpeg listo", "success");
  } catch (err) {
    log(`❌ Error al cargar FFmpeg: ${err.message}`, "error");
    console.error(err);
    throw err;
  }
}

// ─── Manejo de archivo ──────────────────────────────────────
function handleFile(file) {
  if (!file || !file.name.toLowerCase().endsWith(".mp4")) {
    log("Seleccioná un archivo .mp4 válido", "error");
    return;
  }
  selectedFile = file;
  fileName.textContent  = file.name;
  fileSize.textContent  = formatSize(file.size);
  fileInfo.style.display = "flex";
  convertBtn.disabled    = false;
  log(`📁 ${file.name} listo para convertir`, "success");
}

function formatSize(bytes) {
  if (bytes < 1024) return `${bytes} B`;
  if (bytes < 1024 ** 2) return `${(bytes / 1024).toFixed(1)} KB`;
  return `${(bytes / 1024 ** 2).toFixed(1)} MB`;
}

// Eventos de selección
dropZone.addEventListener("click", () => fileInput.click());
fileInput.addEventListener("change", (e) => {
  if (e.target.files?.[0]) handleFile(e.target.files[0]);
});

// Drag & drop
dropZone.addEventListener("dragover", (e) => { e.preventDefault(); dropZone.classList.add("dragover"); });
dropZone.addEventListener("dragleave", () => dropZone.classList.remove("dragover"));
dropZone.addEventListener("drop", (e) => {
  e.preventDefault();
  dropZone.classList.remove("dragover");
  if (e.dataTransfer.files?.[0]) handleFile(e.dataTransfer.files[0]);
});

// ─── Conversión ─────────────────────────────────────────────
convertBtn.addEventListener("click", async () => {
  if (!selectedFile) return;

  convertBtn.disabled = true;
  convertBtn.textContent = "⏳ Convirtiendo…";

  try {
    // Cargar FFmpeg si no está listo
    if (!loaded) {
      convertBtn.textContent = "⏳ Cargando FFmpeg…";
      await loadFFmpeg();
    }

    // Escribir el archivo de entrada en el sistema virtual de FFmpeg
    log("Escribiendo archivo en el FS virtual…", "info");
    const inputName  = "input.mp4";
    const outputName = "output.mkv";
    await ffmpeg.writeFile(inputName, await fetchFile(selectedFile));

    // ─── Comando clave: códec copy ─────────────────────
    //      -c:v copy  → video sin recodificar
    //      -c:a copy  → audio sin recodificar
    //      Solo se remuxea el contenedor (MP4 → MKV)
    log("Remuxeando MP4 → MKV (sin pérdida de calidad)…", "info");
    await ffmpeg.exec(["-i", inputName, "-c:v", "copy", "-c:a", "copy", outputName]);

    // Leer el resultado
    log("Leyendo archivo convertido…", "info");
    const data = await ffmpeg.readFile(outputName);

    // Descargar
    const blob = new Blob([data], { type: "video/x-matroska" });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement("a");
    a.href     = url;
    a.download = selectedFile.name.replace(/\.mp4$/i, ".mkv");
    a.click();
    URL.revokeObjectURL(url);

    // Limpiar el FS virtual
    await ffmpeg.deleteFile(inputName);
    await ffmpeg.deleteFile(outputName);

    log(`✅ ¡Listo! ${a.download} descargado`, "success");
    convertBtn.textContent = "✅ Convertido";
  } catch (err) {
    log(`❌ Error: ${err.message}`, "error");
    console.error(err);
    convertBtn.textContent = "Convertir a MKV";
  } finally {
    convertBtn.disabled = false;
  }
});

// ─── Precargar FFmpeg al abrir la página ────────────────────
loadFFmpeg().catch(() => { /* error ya logueado */ });
</script>
</body>
</html>
