<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MP4 → MKV · ffmpeg.wasm</title>
<style>
* { box-sizing:border-box; margin:0; padding:0 }
body { font-family:system-ui,-apple-system,sans-serif; background:#0b0d17; color:#e2e8f0; display:flex; justify-content:center; align-items:center; min-height:100vh }
.card { background:#12142a; border:1px solid rgba(0,242,255,.1); border-radius:1.25rem; padding:2rem; max-width:560px; width:100%; margin:1rem }
h1 { font-size:1.35rem; font-weight:700; margin-bottom:.2rem }
.sub { color:#64748b; font-size:.8rem; margin-bottom:1.25rem }
hr { border:none; border-top:1px solid rgba(255,255,255,.05); margin:.75rem 0 }

/* Drop zone */
.drop-zone { border:2px dashed rgba(0,242,255,.2); border-radius:1rem; padding:1.5rem 1rem; text-align:center; cursor:pointer; transition:border-color .2s,background .2s }
.drop-zone:hover { border-color:#00f2ff; background:rgba(0,242,255,.03) }
.drop-zone.dragover { border-color:#00f2ff; background:rgba(0,242,255,.06) }
.drop-zone input { display:none }
.drop-zone .icon { font-size:1.8rem; margin-bottom:.3rem }
.drop-zone .label { font-size:.85rem; color:#94a3b8 }
.drop-zone .hint { font-size:.7rem; color:#475569; margin-top:.3rem }

.file-info { display:flex; align-items:center; gap:.6rem; padding:.6rem .9rem; background:rgba(255,255,255,.03); border-radius:.75rem; margin-top:.85rem; font-size:.82rem }
.file-info .name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.file-info .size { color:#64748b }

/* Buttons */
.btn-row { display:flex; gap:.5rem; margin-top:.75rem }
.btn { flex:1; display:inline-flex; align-items:center; justify-content:center; gap:.4rem; padding:.7rem 1.25rem; border:none; border-radius:.75rem; font-weight:600; font-size:.85rem; cursor:pointer; transition:opacity .2s,transform .15s }
.btn:active { transform:scale(.97) }
.btn-primary { background:linear-gradient(135deg,#00f2ff,#8b5cf6); color:#fff }
.btn-primary:disabled { opacity:.35; cursor:not-allowed; transform:none }
.btn-danger { background:rgba(239,68,68,.15); color:#fca5a5; border:1px solid rgba(239,68,68,.25) }
.btn-danger:hover { background:rgba(239,68,68,.25) }
.btn-danger:disabled { opacity:.3; cursor:not-allowed }

/* Progress */
.progress-wrap { margin-top:.75rem; height:5px; border-radius:4px; background:rgba(255,255,255,.06); overflow:hidden }
.progress-bar { height:100%; width:0%; border-radius:4px; background:linear-gradient(90deg,#00f2ff,#8b5cf6); transition:width .3s ease }

/* Status / Log */
.status { margin-top:.65rem; padding:.65rem .85rem; border-radius:.75rem; font-size:.76rem; font-family:monospace; background:rgba(255,255,255,.02); border:1px solid rgba(255,255,255,.04); min-height:2.5rem; max-height:8rem; overflow-y:auto; line-height:1.5 }

.download-link { display:block; margin-top:.75rem; text-align:center; color:#6ee7b7; font-size:.85rem; font-weight:600; text-decoration:none; padding:.6rem; border-radius:.75rem; border:1px solid rgba(16,185,129,.25); transition:background .2s }
.download-link:hover { background:rgba(16,185,129,.08) }

.flex-row { display:flex; justify-content:space-between; align-items:center }
.text-sm { font-size:.8rem }
.text-muted { color:#64748b }
</style>
</head>
<body>

<div class="card">
  <h1>MP4 → MKV</h1>
  <p class="sub">Sin recodificar · timeout + cancelación + logs</p>

  <!-- Drop zone -->
  <div class="drop-zone" id="dropZone">
    <input type="file" id="fileInput" accept=".mp4,video/mp4" />
    <div class="icon">🎬</div>
    <div class="label">Seleccioná o arrastrá un MP4</div>
    <div class="hint">Se procesa al instante en tu navegador</div>
  </div>

  <!-- File info -->
  <div class="file-info" id="fileInfo" hidden>
    <span class="name" id="fileName"></span>
    <span class="size" id="fileSize"></span>
  </div>

  <!-- Buttons -->
  <div class="btn-row">
    <button class="btn btn-primary" id="convertBtn" disabled>Convertir a MKV</button>
    <button class="btn btn-danger" id="cancelBtn" disabled>✕ Cancelar</button>
  </div>

  <!-- Progress -->
  <div class="progress-wrap">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <!-- Status / log -->
  <div class="status" id="status">Esperando archivo…</div>

  <!-- Download -->
  <a class="download-link" id="downloadLink" hidden>⬇ Descargar MKV</a>

  <!-- Timer -->
  <div class="flex-row text-sm text-muted" style="margin-top:.5rem">
    <span id="timerLabel">—</span>
    <span id="sizeInfo"></span>
  </div>
</div>

<!-- ─── Import Map ─────────────────────────────────────── -->
<script type="importmap">
{
  "imports": {
    "@ffmpeg/ffmpeg": "https://unpkg.com/@ffmpeg/ffmpeg@0.12.6/dist/esm/index.js",
    "@ffmpeg/util":   "https://unpkg.com/@ffmpeg/util@0.12.1/dist/esm/index.js"
  }
}
</script>

<script type="module">
// ─── Imports ────────────────────────────────────────────
import { FFmpeg } from "@ffmpeg/ffmpeg";
import { fetchFile, toBlobURL } from "@ffmpeg/util";

// ─── Constantes ─────────────────────────────────────────
const CORE_BASE   = "https://unpkg.com/@ffmpeg/core@0.12.9/dist/esm";
const FFMPEG_BASE = "https://unpkg.com/@ffmpeg/ffmpeg@0.12.6/dist/esm";
const CONVERT_TIMEOUT = 60_000; // 60 s

// ─── DOM ────────────────────────────────────────────────
const $ = s => document.querySelector(s);
const dropZone     = $("#dropZone");
const fileInput    = $("#fileInput");
const fileInfo     = $("#fileInfo");
const fileName     = $("#fileName");
const fileSize     = $("#fileSize");
const convertBtn   = $("#convertBtn");
const cancelBtn    = $("#cancelBtn");
const progressBar  = $("#progressBar");
const statusEl     = $("#status");
const downloadLink = $("#downloadLink");
const timerLabel   = $("#timerLabel");
const sizeInfo     = $("#sizeInfo");

let selectedFile  = null;
let currentFFmpeg = null;
let cancelled     = false;
let timerInterval = null;
let startTime     = 0;

// ─── Logger ─────────────────────────────────────────────
function log(msg, type = "info") {
  const colors = { ok:"#6ee7b7", err:"#fca5a5", info:"#67e8f9", neutral:"#94a3b8" };
  const dot = colors[type] || colors.neutral;
  statusEl.innerHTML += `<span style="color:${dot}">●</span> ${msg}<br>`;
  statusEl.scrollTop = statusEl.scrollHeight;
}

function setStatus(msg, type = "info") {
  statusEl.innerHTML = `<span style="color:${colors[type]||colors.neutral}">●</span> ${msg}<br>`;
}

const colors = { ok:"#6ee7b7", err:"#fca5a5", info:"#67e8f9", neutral:"#94a3b8" };

function setProgress(pct) { progressBar.style.width = `${Math.min(Math.max(pct, 0), 100)}%`; }

function fmtSize(bytes) {
  if (!bytes) return "0 B";
  if (bytes < 1024) return `${bytes} B`;
  if (bytes < 1024**2) return `${(bytes/1024).toFixed(1)} KB`;
  return `${(bytes/1024**2).toFixed(1)} MB`;
}

function fmtTime(ms) {
  if (ms < 1000) return `${ms} ms`;
  if (ms < 60000) return `${(ms/1000).toFixed(1)} s`;
  const m = Math.floor(ms/60000);
  const s = ((ms%60000)/1000).toFixed(1);
  return `${m}m ${s}s`;
}

function startTimer() {
  startTime = Date.now();
  timerInterval = setInterval(() => {
    timerLabel.textContent = `⏱ ${fmtTime(Date.now() - startTime)}`;
  }, 200);
}

function stopTimer() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  if (startTime) timerLabel.textContent = `⏱ ${fmtTime(Date.now() - startTime)}`;
}

// ─── FFmpeg loader con worker inline ───────────────────
async function createInlineWorkerBlob() {
  const [workerSrc, constSrc, errorsSrc] = await Promise.all(
    ["worker.js","const.js","errors.js"].map(f =>
      fetch(`${FFMPEG_BASE}/${f}`).then(r => { if (!r.ok) throw Error(`fetch ${f}: ${r.status}`); return r.text(); })
    )
  );
  // inline: strip export keywords from deps → remove static imports from worker
  const combined = [
    constSrc.replace(/^export /gm, ""),
    errorsSrc.replace(/^export /gm, ""),
    workerSrc.replace(/^import .+ from ["'].+["'];?$/gm, ""),
  ].join("\n");
  return URL.createObjectURL(new Blob([combined], { type: "text/javascript" }));
}

function patchWorkerForFFmpeg(blobURL) {
  const NativeWorker = globalThis.Worker;
  globalThis.Worker = class extends NativeWorker {
    constructor(url, opts) {
      const str = typeof url === "string" ? url : url.href;
      if (str.includes("/@ffmpeg/ffmpeg@") && str.endsWith("/worker.js"))
        super(blobURL, opts);
      else super(url, opts);
    }
  };
  return () => { globalThis.Worker = NativeWorker; };
}

// ─── Cargar FFmpeg ──────────────────────────────────────
async function loadFFmpeg() {
  log("Preparando worker inlinado…", "info");
  const workerBlob = await createInlineWorkerBlob();
  const restoreWorker = patchWorkerForFFmpeg(workerBlob);

  try {
    const coreURL = await toBlobURL(`${CORE_BASE}/ffmpeg-core.js`, "text/javascript");
    const wasmURL = await toBlobURL(`${CORE_BASE}/ffmpeg-core.wasm`, "application/wasm");

    const ffmpeg = new FFmpeg();

    ffmpeg.on("log", ({ message }) => {
      if (message.length < 200) log(message, "neutral");
    });
    ffmpeg.on("progress", ({ progress }) => {
      if (progress != null) setProgress(progress * 100);
    });

    await ffmpeg.load({ coreURL, wasmURL });

    log("✓ FFmpeg listo", "ok");
    return ffmpeg;
  } finally {
    restoreWorker();
    setTimeout(() => URL.revokeObjectURL(workerBlob), 1000);
  }
}

// ─── Manejo de archivo ─────────────────────────────────
function handleFile(file) {
  downloadLink.hidden = true;
  timerLabel.textContent = "—";
  sizeInfo.textContent = "";

  if (!file || !file.name.toLowerCase().endsWith(".mp4")) {
    setStatus("Seleccioná un archivo .mp4", "err");
    return;
  }
  selectedFile = file;
  fileName.textContent = file.name;
  fileSize.textContent = fmtSize(file.size);
  fileInfo.hidden = false;
  convertBtn.disabled = false;
  sizeInfo.textContent = `Tamaño: ${fmtSize(file.size)}`;
  setStatus(`✓ ${file.name} listo`, "ok");
}

dropZone.addEventListener("click", () => fileInput.click());
fileInput.addEventListener("change", e => { if (e.target.files?.[0]) handleFile(e.target.files[0]); });
dropZone.addEventListener("dragover", e => { e.preventDefault(); dropZone.classList.add("dragover"); });
dropZone.addEventListener("dragleave", () => dropZone.classList.remove("dragover"));
dropZone.addEventListener("drop", e => {
  e.preventDefault();
  dropZone.classList.remove("dragover");
  if (e.dataTransfer.files?.[0]) handleFile(e.dataTransfer.files[0]);
});

// ─── Conversión ─────────────────────────────────────────
async function runConversion() {
  if (!selectedFile) return;

  cancelled = false;
  convertBtn.disabled = true;
  cancelBtn.disabled = false;
  downloadLink.hidden = true;
  setProgress(0);
  setStatus("Iniciando…", "info");
  statusEl.innerHTML = ""; // clear
  startTimer();

  let ffmpeg = null;

  try {
    // 1) Load FFmpeg
    log("Cargando FFmpeg…", "info");
    ffmpeg = await loadFFmpeg();
    currentFFmpeg = ffmpeg;
    setProgress(10);

    // 2) Write input file
    log(`Escribiendo ${selectedFile.name}…`, "info");
    const inputName = "input.mp4";
    await ffmpeg.writeFile(inputName, await fetchFile(selectedFile));
    setProgress(20);

    // 3) Prepare args — include -y and -nostdin to prevent hanging
    const outputName = "output.mkv";
    const args = [
      "-y",               // overwrite output (prevents stdin prompt)
      "-nostdin",         // don't read stdin
      "-i", inputName,
      "-c:v", "copy",     // video: stream copy (no recode)
      "-c:a", "copy",     // audio: stream copy
      "-progress", "pipe:1", // force progress output to stdout
      outputName,
    ];
    log(`Ejecutando: ffmpeg ${args.join(" ")}`, "info");

    // Fake progress ticker for operations that don't report real progress
    let fakeProgress = 20;
    const fakeTimer = setInterval(() => {
      if (cancelled) return;
      fakeProgress = Math.min(fakeProgress + 1, 90);
      setProgress(fakeProgress);
    }, 2000);

    // 4) Exec with timeout
    const execPromise = ffmpeg.exec(args, CONVERT_TIMEOUT);
    const timeoutPromise = new Promise((_, reject) =>
      setTimeout(() => reject(new Error(`⏱ Tiempo excedido (${CONVERT_TIMEOUT/1000}s)`)), CONVERT_TIMEOUT + 5000)
    );

    const exitCode = await Promise.race([execPromise, timeoutPromise]);
    clearInterval(fakeTimer);

    if (cancelled) throw new Error("Cancelado por el usuario");

    log(`ffmpeg exit code: ${exitCode}`, "info");
    setProgress(92);

    // 5) Read output file
    log("Leyendo archivo de salida…", "info");
    let data;
    try {
      data = await ffmpeg.readFile(outputName);
    } catch (readErr) {
      // Si falló con copy, intentar recodificando
      log("⚠ Falló con copy, reintentando con recodificación H.264/AAC…", "err");
      await ffmpeg.deleteFile(inputName); // reset
      await ffmpeg.writeFile(inputName, await fetchFile(selectedFile));

      const fallbackArgs = [
        "-y", "-nostdin",
        "-i", inputName,
        "-c:v", "libx264", "-preset", "fast", "-crf", "23",
        "-c:a", "aac", "-b:a", "128k",
        outputName,
      ];
      log(`Fallback: ffmpeg ${fallbackArgs.join(" ")}`, "info");
      await ffmpeg.exec(fallbackArgs, CONVERT_TIMEOUT * 2);
      if (cancelled) throw new Error("Cancelado por el usuario");
      data = await ffmpeg.readFile(outputName);
    }

    if (!data || (typeof data === "object" && data.length === 0)) {
      throw new Error("Archivo de salida vacío");
    }

    setProgress(98);

    // 6) Download
    const blob = new Blob([data], { type: "video/x-matroska" });
    const url  = URL.createObjectURL(blob);
    downloadLink.href     = url;
    downloadLink.download = selectedFile.name.replace(/\.mp4$/i, ".mkv");
    downloadLink.textContent = `⬇ Descargar ${downloadLink.download} (${fmtSize(blob.size)})`;
    downloadLink.hidden   = false;

    stopTimer();
    setProgress(100);
    log("✓ Conversión completada", "ok");
  } catch (err) {
    stopTimer();
    if (cancelled) {
      log(`✕ ${err.message}`, "err");
    } else if (err.message?.includes("Tiempo excedido")) {
      log(`✕ ${err.message} — El archivo es muy grande o el códec no es compatible.`, "err");
    } else {
      log(`✕ Error: ${err.message}`, "err");
      console.error(err);
    }
  } finally {
    if (ffmpeg) {
      try {
        await ffmpeg.deleteFile("input.mp4").catch(() => {});
        await ffmpeg.deleteFile("output.mkv").catch(() => {});
        ffmpeg.terminate();
      } catch {}
    }
    currentFFmpeg = null;
    convertBtn.disabled = false;
    cancelBtn.disabled = true;
  }
}

convertBtn.addEventListener("click", runConversion);

// ─── Cancelar ───────────────────────────────────────────
cancelBtn.addEventListener("click", () => {
  cancelled = true;
  log("✕ Cancelando…", "err");
  if (currentFFmpeg) {
    currentFFmpeg.terminate();
    currentFFmpeg = null;
  }
  convertBtn.disabled = false;
  cancelBtn.disabled = true;
  setProgress(0);
});

// ─── Estado inicial ─────────────────────────────────────
setStatus("Esperando archivo…", "neutral");
</script>
</body>
</html>
