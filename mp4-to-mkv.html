<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MP4 → MKV · ffmpeg.wasm</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0b0d17;
      color: #e2e8f0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #12142a;
      border: 1px solid rgba(0, 242, 255, 0.1);
      border-radius: 1.25rem;
      padding: 2rem;
      max-width: 520px;
      width: 100%;
      margin: 1rem;
    }
    h1 { font-size: 1.35rem; font-weight: 700; margin-bottom: 0.2rem; }
    .sub { color: #64748b; font-size: 0.8rem; margin-bottom: 1.5rem; }

    /* ── Input ─────────────────────── */
    .drop-zone {
      border: 2px dashed rgba(0, 242, 255, 0.2);
      border-radius: 1rem;
      padding: 1.75rem 1rem;
      text-align: center;
      cursor: pointer;
      transition: border-color .2s, background .2s;
    }
    .drop-zone:hover { border-color: #00f2ff; background: rgba(0,242,255,.03); }
    .drop-zone.dragover { border-color: #00f2ff; background: rgba(0,242,255,.06); }
    .drop-zone input { display: none; }
    .drop-zone .label { font-size: .85rem; color: #94a3b8; }
    .drop-zone .hint { font-size: .7rem; color: #475569; margin-top: .35rem; }

    .file-info {
      display: flex; align-items: center; gap: .6rem;
      padding: .6rem .9rem;
      background: rgba(255,255,255,.03);
      border-radius: .75rem; margin-top: .85rem;
      font-size: .82rem;
    }
    .file-info .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-info .size { color: #64748b; font-variant-numeric: tabular-nums; }

    /* ── Botón ─────────────────────── */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: .4rem;
      width: 100%; padding: .7rem 1.25rem; border: none; border-radius: .75rem;
      font-weight: 600; font-size: .85rem; cursor: pointer;
      transition: opacity .2s, transform .15s;
    }
    .btn:active { transform: scale(.97); }
    .btn-primary { background: linear-gradient(135deg,#00f2ff,#8b5cf6); color: #fff; }
    .btn-primary:disabled { opacity: .35; cursor: not-allowed; transform: none; }

    /* ── Progreso ──────────────────── */
    .progress-wrap {
      margin-top: .85rem; height: 5px; border-radius: 4px;
      background: rgba(255,255,255,.06); overflow: hidden;
    }
    .progress-bar {
      height: 100%; width: 0%; border-radius: 4px;
      background: linear-gradient(90deg,#00f2ff,#8b5cf6);
      transition: width .25s ease;
    }

    /* ── Log ───────────────────────── */
    .log {
      margin-top: .75rem;
      padding: .65rem .85rem;
      border-radius: .75rem;
      font-size: .76rem; font-family: monospace;
      background: rgba(255,255,255,.02);
      border: 1px solid rgba(255,255,255,.04);
      min-height: 2.5rem; max-height: 8rem;
      overflow-y: auto; line-height: 1.5;
    }
    .log::-webkit-scrollbar { width: 3px; }
    .log::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 2px; }

    /* ── Descarga ──────────────────── */
    .download-link {
      display: block; margin-top: .75rem; text-align: center;
      color: #6ee7b7; font-size: .85rem; font-weight: 600;
      text-decoration: none; padding: .6rem; border-radius: .75rem;
      border: 1px solid rgba(16,185,129,.25);
      transition: background .2s;
    }
    .download-link:hover { background: rgba(16,185,129,.08); }

    .mt-2 { margin-top: .75rem; }
  </style>
</head>
<body>

<div class="card">
  <h1>MP4 → MKV</h1>
  <p class="sub">Remuxeado directo en el navegador · códec copy</p>

  <div class="drop-zone" id="dropZone">
    <input type="file" id="fileInput" accept=".mp4,video/mp4" />
    <div class="label">Seleccioná o arrastrá un MP4</div>
    <div class="hint">Se procesa al instante, sin servidor</div>
  </div>

  <div class="file-info" id="fileInfo" hidden>
    <span class="name" id="fileName"></span>
    <span class="size" id="fileSize"></span>
  </div>

  <button class="btn btn-primary mt-2" id="convertBtn" disabled>
    Convertir a MKV
  </button>

  <div class="progress-wrap">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <div class="log" id="log">⬤ Inicializando…</div>

  <a class="download-link" id="downloadLink" hidden>
    ⬇ Descargar MKV
  </a>
</div>

<!-- ─── Import Map ────────────────────────────────────── -->
<script type="importmap">
{
  "imports": {
    "@ffmpeg/ffmpeg": "https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.15/+esm",
    "@ffmpeg/util":   "https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.2/+esm"
  }
}
</script>

<script type="module">
// ─── Imports ────────────────────────────────────────────
import { FFmpeg } from "@ffmpeg/ffmpeg";
import { fetchFile, toBlobURL } from "@ffmpeg/util";

// ─── DOM refs ───────────────────────────────────────────
const $ = (s) => document.querySelector(s);
const dropZone     = $("#dropZone");
const fileInput    = $("#fileInput");
const fileInfo     = $("#fileInfo");
const fileName     = $("#fileName");
const fileSize     = $("#fileSize");
const convertBtn   = $("#convertBtn");
const progressBar  = $("#progressBar");
const logEl        = $("#log");
const downloadLink = $("#downloadLink");

let selectedFile = null;
let ffmpeg       = null;
let loaded       = false;

// ─── Logger ─────────────────────────────────────────────
function logger(msg, type) {
  const colors = { ok: "#6ee7b7", err: "#fca5a5", info: "#67e8f9", neutral: "#94a3b8" };
  const dot   = colors[type] || colors.neutral;
  logEl.innerHTML += `<span style="color:${dot}">●</span> ${msg}<br>`;
  logEl.scrollTop = logEl.scrollHeight;
}

// ─── Progreso ───────────────────────────────────────────
function setProgress(pct) {
  progressBar.style.width = `${Math.min(pct, 100)}%`;
}

// ─── Cargar FFmpeg con Blob URLs ───────────────────────
async function loadFFmpeg() {
  if (loaded) return;

  const base = "https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/esm";

  ffmpeg = new FFmpeg();

  ffmpeg.on("log", ({ message }) => {
    if (message.length > 120) return; // omitir líneas muy largas
    logger(message, "neutral");
  });
  ffmpeg.on("progress", ({ progress }) => {
    setProgress(progress * 100);
  });

  try {
    logger("Descargando core desde CDN…", "info");

    // ─── toBlobURL(): fetch → Blob → blob: URL ─────
    //      Al convertir los scripts CDN a blob: URLs,
    //      el Worker se crea desde el mismo origen que
    //      la página → no hay SecurityError.
    const coreURL   = await toBlobURL(`${base}/ffmpeg-core.js`,   "text/javascript");
    const wasmURL   = await toBlobURL(`${base}/ffmpeg-core.wasm`, "application/wasm");
    const workerURL = await toBlobURL(`${base}/ffmpeg-core.worker.js`, "text/javascript");

    logger("Inicializando FFmpeg…", "info");
    await ffmpeg.load({ coreURL, wasmURL, workerURL });
    loaded = true;
    logger("✓ FFmpeg listo", "ok");
    setProgress(100);
  } catch (err) {
    logger(`✗ Error: ${err.message}`, "err");
    console.error(err);
    throw err;
  }
}

// ─── Manejo de archivo ──────────────────────────────────
function handleFile(file) {
  downloadLink.hidden = true;

  if (!file || !file.name.toLowerCase().endsWith(".mp4")) {
    logger("Seleccioná un archivo .mp4", "err");
    return;
  }
  selectedFile = file;
  fileName.textContent = file.name;
  fileSize.textContent = fmtSize(file.size);
  fileInfo.hidden      = false;
  convertBtn.disabled  = false;
  logger(`✓ ${file.name} (${fmtSize(file.size)})`, "ok");
}

function fmtSize(bytes) {
  if (bytes < 1024) return `${bytes} B`;
  if (bytes < 1024 ** 2) return `${(bytes / 1024).toFixed(1)} KB`;
  return `${(bytes / 1024 ** 2).toFixed(1)} MB`;
}

// Eventos
dropZone.addEventListener("click", () => fileInput.click());
fileInput.addEventListener("change", (e) => {
  if (e.target.files?.[0]) handleFile(e.target.files[0]);
});
dropZone.addEventListener("dragover", (e) => { e.preventDefault(); dropZone.classList.add("dragover"); });
dropZone.addEventListener("dragleave", () => dropZone.classList.remove("dragover"));
dropZone.addEventListener("drop", (e) => {
  e.preventDefault();
  dropZone.classList.remove("dragover");
  if (e.dataTransfer.files?.[0]) handleFile(e.dataTransfer.files[0]);
});

// ─── Conversión ─────────────────────────────────────────
convertBtn.addEventListener("click", async () => {
  if (!selectedFile) return;

  convertBtn.disabled    = true;
  convertBtn.textContent = "Procesando…";
  setProgress(0);
  downloadLink.hidden    = true;

  try {
    if (!loaded) await loadFFmpeg();

    const inName  = "input.mp4";
    const outName = "output.mkv";

    logger("Escribiendo archivo en el sistema virtual…", "info");
    await ffmpeg.writeFile(inName, await fetchFile(selectedFile));
    setProgress(15);

    // Remux: sólo cambia el contenedor, sin recodificar
    logger("Remuxeando MP4 → MKV (copy)…", "info");
    await ffmpeg.exec(["-i", inName, "-c:v", "copy", "-c:a", "copy", outName]);
    setProgress(80);

    logger("Leyendo resultado…", "info");
    const data = await ffmpeg.readFile(outName);
    setProgress(95);

    const blob = new Blob([data], { type: "video/x-matroska" });
    const url  = URL.createObjectURL(blob);

    downloadLink.href     = url;
    downloadLink.download = selectedFile.name.replace(/\.mp4$/i, ".mkv");
    downloadLink.hidden   = false;
    downloadLink.textContent = `⬇ Descargar ${downloadLink.download}`;

    await ffmpeg.deleteFile(inName);
    await ffmpeg.deleteFile(outName);

    setProgress(100);
    logger("✓ ¡Conversión completada!", "ok");
    convertBtn.textContent = "Convertir otro";
  } catch (err) {
    logger(`✗ Error: ${err.message}`, "err");
    console.error(err);
    convertBtn.textContent = "Reintentar";
  } finally {
    convertBtn.disabled = false;
  }
});

// Precarga al abrir la página
loadFFmpeg().catch(() => {});
</script>
</body>
</html>
